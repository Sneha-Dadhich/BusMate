<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel - Driver Management</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

  <!-- SIDEBAR -->
  <div class="sidebar" id="sidebar">
    <button class="toggle-btn" onclick="toggleSidebar()">☰</button>

    <h2>Admin Panel</h2>

    <a href="{{ url_for('manage_bus') }}">🚌 <span>Manage Buses</span></a>
    <a href="{{ url_for('manage_driver') }}">🙋🏻‍♂️ <span>Manage Driver</span></a>
    <a href="{{ url_for('manage_routes') }}">🛣 <span>Manage Routes</span></a>
    <a href="{{ url_for('logout') }}">🚪 <span>Logout</span></a>
  </div>

  <!-- MAIN CONTENT -->
  <div class="main-content" id="mainContent">

    <div class="title-row">
      <img src="{{ url_for('static', filename='images/jiet_logo.jpg') }}" class="title-logo">
      <h1>Driver Management</h1>
    </div>

    <div class="top-bar">
      <button class="add-btn" onclick="openAddDriverModal()">+ Add Driver</button>
    </div>

    <!-- TABLE -->
    <div class="table-container">
      <table id="outputTable">
        <thead>
          <tr>
            <th>Driver ID</th>
            <th>Driver Name</th>
            <th>Phone Number</th>
            <th>Action</th>
          </tr>
        </thead>

        <tbody>
          {% for driver in drivers %}
          <tr>
            <td>{{ driver.driver_id }}</td>
            <td>{{ driver.driver_name }}</td>
            <td>{{ driver.phone_number }}</td>
            <td>
              <button class="delete-btn" onclick="deleteDriver('{{ driver.driver_id }}', this)">Delete</button>
            </td>
          </tr>
          {% endfor %}
        </tbody>

      </table>
    </div>

  </div>


  <!-- ============================
        ADD DRIVER POP-UP MODAL
       ============================ -->
  <div id="addDriverModal" class="modal">
    <div class="modal-content">

      <span class="close" onclick="closeAddDriverModal()">&times;</span>

      <h2>Add New Driver</h2>

      <label>Driver Name</label>
      <input type="text" id="driverName" placeholder="Enter driver name">

      <label>Phone Number</label>
      <input type="text" id="driverPhone" placeholder="Enter phone number">

      <div class="modal-buttons">
        <button class="save-btn" onclick="submitNewBus()">Save</button>
        <button class="delete-btn" onclick="closeModal()">Cancel</button>
      </div>

    </div>
  </div>

  <script>

    // SIDEBAR TOGGLE
    function toggleSidebar() {
      document.getElementById("sidebar").classList.toggle("collapsed");
      document.getElementById("mainContent").classList.toggle("collapsed");
    }

    function closeModal() {
      document.getElementById("addBusModal").style.display = "none";
    }

    // ============================
    //      OPEN / CLOSE MODAL
    // ============================
    function openAddDriverModal() {
      document.getElementById("addDriverModal").style.display = "flex";
    }

    function closeAddDriverModal() {
      document.getElementById("addDriverModal").style.display = "none";
    }

    // ============================
    //      SAVE DRIVER
    // ============================
    function saveDriver() {
      const name = document.getElementById("driverName").value.trim();
      const phone = document.getElementById("driverPhone").value.trim();

      if (!name || !phone) {
        alert("Please enter both name and phone number.");
        return;
      }

      fetch("/add_driver", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          driver_name: name,
          phone_number: phone
        })
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          alert("Driver added successfully!");
          location.reload();
        } else {
          alert("Error: " + data.message);
        }
      })
      .catch(err => console.error(err));
    }

    // ============================
    //        DELETE DRIVER
    // ============================
    function deleteDriver(driverId, button) {

      if (!confirm("Are you sure you want to delete driver ID: " + driverId + "?"))
        return;

      fetch("/delete_driver", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ driver_id: driverId })
      })
        .then(res => res.json())
        .then(data => {
          if (data.success) {
            alert("Driver deleted!");
            button.closest("tr").remove();
          } else {
            alert("Failed: " + data.message);
          }
        })
        .catch(err => console.error(err));
    }

  </script>

</body>

</html>
