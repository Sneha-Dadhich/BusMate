<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - User Management</title>
  <style>

    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      height: 100vh;
      background: #f4f6f9;
    }

    /* Sidebar */
    .sidebar {
      width: 220px;
      background: #1e293b;
      color: #fff;
      display: flex;
      flex-direction: column;
      padding: 20px;
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      box-shadow: 2px 0 5px rgba(0, 0, 0, 0.2);
      transition: width 0.3s ease;
      overflow: hidden;
    }

    .sidebar.collapsed {
      width: 60px;
    }

    .sidebar h2 {
      margin: 0 0 20px;
      font-size: 20px;
      text-align: center;
      transition: opacity 0.3s ease;
    }

    .sidebar.collapsed h2 {
      opacity: 0;
      height: 0;
    }

    .sidebar a {
      color: #cbd5e1;
      text-decoration: none;
      padding: 12px 15px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      margin-bottom: 10px;
      transition: all 0.3s;
      white-space: nowrap;
    }

    .sidebar a:hover {
      background: #334155;
      color: #fff;
    }

    .sidebar.collapsed a span {
      display: none;
    }

    /* Toggle Button */
    .toggle-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      margin-bottom: 20px;
      align-self: flex-end;
    }

    /* Main Content */
    .main-content {
      margin-left: 220px;
      padding: 30px;
      flex: 1;
      transition: margin-left 0.3s ease;
    }

    .main-content.collapsed {
      margin-left: 60px;
    }

    .main-content h2 {
      font-size: 26px;
      color: #1e293b;
      text-align: center;
      margin-bottom: 20px;
    }

    #formContainer {
      text-align: center;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-top: 10px;
    }

    input,
    textarea,
    select {
      width: 300px;
      padding: 8px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }

    button {
      margin: 10px 5px;
      padding: 8px 16px;
      background-color: #2563eb;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background-color: #1d4ed8;
    }

    table {
      border-collapse: collapse;
      margin: 0 auto;
      width: 100%;
      max-width: 900px;
    }

    th,
    td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: center;
    }

    th {
      background-color: #2563eb;
      color: #fff;
    }

    .action-btn {
      background-color: #2563eb;
    }

    .action-btn:hover {
      background-color: #1d4ed8;
    }

    .delete-btn {
      background-color: #ef4444;
    }

    .delete-btn:hover {
      background-color: #dc2626;
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        height: 100%;
        z-index: 100;
      }

      .main-content {
        margin-left: 60px;
        padding: 15px;
      }

      input,
      textarea,
      select {
        width: 60%;
      }

      table {
        font-size: 12px;
      }
    }
  </style>
</head>

<body>
  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <button class="toggle-btn" onclick="toggleSidebar()">☰</button>
    <h2>Admin Panel</h2>
    <a href="{{ url_for('manage_bus') }}">🚌 <span>Manage Buses</span></a>
    <a href="{{ url_for('manage_driver') }}">🙋🏻‍♂️ <span>Manage Driver</span></a>
    <a href="{{ url_for('manage_routes') }}">🛣 <span>Manage Routes</span></a>
    <a href="{{ url_for('logout') }}">🚪 <span>Logout</span></a>
  </div>

  <!-- Main Content -->
  <div class="main-content" id="mainContent">
    <h2>Driver Data Management</h2>

    <div id="formContainer">
      <label for="busIdInput">Driver ID</label>
      <input type="text" id="busIdInput" placeholder="Enter Bus ID...">

      <label for="busNumberInput">Driver Name</label>
      <input type="text" id="busNumberInput" placeholder="Enter Bus Number...">

      <label for="busCapacityInput">Driver Phone Number</label>
      <input type="text" id="busCapacityInput" placeholder="Enter Bus Capacity...">

      </select>

      <br>
      <button onclick="addData()">Add</button>
    </div>

    <table id="outputTable">
      <thead>
        <tr>
          <th>Driver ID</th>
          <th>Driver Name</th>
          <th>Driver Phone Number</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        {% for driver in drivers %}
        <tr>
          <td>{{ driver.driver_id }}</td>
          <td>{{ driver.driver_name }}</td>
          <td>{{ driver.phone_number }}</td>
          <td>
            <button class="action-btn" onclick="editData(this)">Edit</button>
            <button class="delete-btn" onclick="deleteData(this)">Delete</button>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>

  <script>
    function toggleSidebar() {
      document.getElementById("sidebar").classList.toggle("collapsed");
      document.getElementById("mainContent").classList.toggle("collapsed");
    }
  </script>
</body>

</html>
