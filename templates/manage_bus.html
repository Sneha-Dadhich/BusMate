<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel - Bus Management</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

  <div class="sidebar" id="sidebar">
    <button class="toggle-btn" onclick="toggleSidebar()">☰</button>

    <h2>Admin Panel</h2>

    <a href="{{ url_for('manage_bus') }}">🚌 <span>Manage Buses</span></a>
    <a href="{{ url_for('manage_driver') }}">🙋🏻‍♂️ <span>Manage Driver</span></a>
    <a href="{{ url_for('manage_routes') }}">🛣 <span>Manage Routes</span></a>
    <a href="{{ url_for('logout') }}">🚪 <span>Logout</span></a>
  </div>

  <div class="container">
    <div class="title-row">
      <img src="{{ url_for('static', filename='images/jiet_logo.jpg') }}" class="title-logo">
      <h1>Bus Management</h1>
  </div>

  <div class="top-bar">
    <button class="add-btn" onclick="addNewRow()">+ Add Bus</button>
  </div>


    <div class="table-container">
      <table id="busTable">
        <thead>
          <tr>
            <th>Bus ID</th>
            <th>Bus Number</th>
            <th>Driver Name</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          {% for row in buses %}
          <tr>
            <td>{{ row.bus_id }}</td>
            <td>{{ row.bus_number }}</td>
            <td>{{ row.driver_name }}</td>
            <td>
              <button class="delete-btn" onclick="deleteBus('{{ row.bus_id }}')">Delete</button>
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>

  <!-- ADD BUS POPUP -->
  <div id="addBusModal" class="modal">
    <div class="modal-content">
      <h3>Add New Bus</h3>

      <label>Bus ID:</label>
      <input type="text" id="busID" placeholder="Enter Bus Number">

      <label>Bus Number:</label>
      <input type="text" id="busNumberInput" placeholder="Enter Bus Number">

      <label>Bus Capacity:</label>
      <input type="text" id="busCapacity" placeholder="Enter Bus Number">

      <label>Driver Name:</label>
      <select id="driverDropdown">
        <option value="">Select Driver</option>
      </select>

      <div class="modal-buttons">
        <button class="save-btn" onclick="submitNewBus()">Save</button>
        <button class="delete-btn" onclick="closeModal()">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    // Open popup
    function addNewRow() {
      document.getElementById("addBusModal").style.display = "flex";
      loadDrivers();
    }

    function toggleSidebar() {
      document.getElementById("sidebar").classList.toggle("collapsed");
      // document.getElementById("mainContent").classList.toggle("collapsed");
    }

    function closeModal() {
      document.getElementById("addBusModal").style.display = "none";
    }

    // Load drivers dynamically from SQL
    function loadDrivers() {
      fetch("/get_drivers")
        .then(res => res.json())
        .then(data => {
          const dropdown = document.getElementById("driverDropdown");
          dropdown.innerHTML = '<option value="">Select Driver</option>';

          data.drivers.forEach(driver => {
            let option = document.createElement("option");
            option.value = driver;
            option.textContent = driver;
            dropdown.appendChild(option);
          });
        });
    }

    // Submit new bus
    function submitNewBus() {
      const busID = document.getElementById("busID").value.trim();
      const busNumber = document.getElementById("busNumberInput").value.trim();
      const busCapacity = document.getElementById("busCapacity").value.trim();
      const driverName = document.getElementById("driverDropdown").value.trim();

      if (!busID || !busNumber || !busCapacity || !driverName) {
        alert("⚠️ Please fill all fields.");
        return;
      }

      fetch("/add_bus", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          busID: busID,
          bus_number: busNumber,
          busCapacity: busCapacity,
          driver_name: driverName
      })
    })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          alert("✅ Bus added successfully!");
          location.reload();
        } else {
          alert("❌ Error: " + data.message);
        }
      });
  }

    // Delete bus
    function deleteBus(id) {
      if (!confirm("Are you sure?")) return;

      fetch("/delete_bus", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ bus_id: id })
      })
        .then(res => res.json())
        .then(data => {
          if (data.success) location.reload();
          else alert("Error deleting bus");
        });
    }
  </script>

</body>

</html>
