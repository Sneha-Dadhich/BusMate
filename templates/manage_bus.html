<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel - Bus Data Management</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      height: 100vh;
      background: #f4f6f9;
    }

    /* Sidebar */
    .sidebar {
      width: 220px;
      background: #1e293b;
      color: #fff;
      display: flex;
      flex-direction: column;
      padding: 20px;
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      box-shadow: 2px 0 5px rgba(0, 0, 0, 0.2);
      transition: width 0.3s ease;
      overflow: hidden;
    }

    .sidebar.collapsed {
      width: 60px;
    }

    .sidebar h2 {
      margin: 0 0 20px;
      font-size: 20px;
      text-align: center;
      transition: opacity 0.3s ease;
    }

    .sidebar.collapsed h2 {
      opacity: 0;
      height: 0;
    }

    .sidebar a {
      color: #cbd5e1;
      text-decoration: none;
      padding: 12px 15px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      margin-bottom: 10px;
      transition: all 0.3s;
      white-space: nowrap;
    }

    .sidebar a:hover {
      background: #334155;
      color: #fff;
    }

    .sidebar.collapsed a span {
      display: none;
    }

    /* Toggle Button */
    .toggle-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      margin-bottom: 20px;
      align-self: flex-end;
    }

    /* Main Content */
    .main-content {
      margin-left: 220px;
      padding: 30px;
      flex: 1;
      transition: margin-left 0.3s ease;
    }

    .main-content.collapsed {
      margin-left: 60px;
    }

    .main-content h2 {
      font-size: 26px;
      color: #1e293b;
      text-align: center;
      margin-bottom: 20px;
    }

    button {
      margin: 5px;
      padding: 8px 14px;
      border: none;
      border-radius: 5px;
      color: #fff;
      cursor: pointer;
      font-size: 14px;
    }

    .add-btn {
      background-color: #2563eb;
    }

    .add-btn:hover {
      background-color: #1d4ed8;
    }

    .save-btn {
      background-color: #10b981;
    }

    .save-btn:hover {
      background-color: #059669;
    }

    .delete-btn {
      background-color: #ef4444;
    }

    .delete-btn:hover {
      background-color: #dc2626;
    }

    /* Table */
    .table-container {
      width: 100%;
      overflow-x: auto;
      background: white;
      border-radius: 8px;
      box-shadow: 0 0 8px rgba(0, 0, 0, 0.1);
      margin-top: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 700px;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: center;
    }

    th {
      background-color: #04AA6D;
      color: white;
    }

    tr:nth-child(even) {
      background-color: #f9f9f9;
    }

    tr:hover {
      background-color: #f1f5f9;
    }

    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        height: 100%;
        z-index: 100;
      }

      .main-content {
        margin-left: 70px;
        padding: 15px;
      }

      table {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>
  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <button class="toggle-btn" onclick="toggleSidebar()">☰</button>
    <h2>Admin Panel</h2>
    <a href="{{ url_for('manage_bus') }}">🚌 <span>Manage Buses</span></a>
    <a href="{{ url_for('manage_driver') }}">🙋🏻‍♂️ <span>Manage Driver</span></a>
    <a href="{{ url_for('manage_routes') }}">🛣 <span>Manage Routes</span></a>
    <a href="{{ url_for('logout') }}">🚪 <span>Logout</span></a>
  </div>

  <!-- Main Content -->
  <div class="main-content" id="mainContent">
    <h2>Bus Data Management</h2>

    <div style="text-align: right; margin-bottom: 15px;">
      <button class="add-btn" onclick="addNewRow()">➕ Add New Bus</button>
    </div>

    <div class="table-container">
      <table id="outputTable">
        <thead>
          <tr>
            <th>Bus ID</th>
            <th>Bus Number</th>
            <th>Driver Name</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          {% for bus in buses %}
          <tr>
            <td>{{ bus.bus_id }}</td>
            <td>{{ bus.bus_number }}</td>
            <td>{{ bus.driver_name }}</td>
            <td>
              <button class="delete-btn" onclick="deleteBus(this)">Delete</button>
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // Toggle sidebar
    function toggleSidebar() {
      document.getElementById("sidebar").classList.toggle("collapsed");
      document.getElementById("mainContent").classList.toggle("collapsed");
    }

    // ✅ DELETE FUNCTION
    function deleteBus(button) {
      const row = button.closest("tr");
      const busId = row.cells[0].textContent.trim();

      if (confirm(`Are you sure you want to delete Bus ID: ${busId}?`)) {
        fetch(`/delete_bus`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ bus_id: busId })
        })
          .then(res => res.json())
          .then(data => {
            if (data.success) {
              alert("✅ Bus deleted successfully!");
              row.remove();
            } else {
              alert("❌ Failed to delete bus: " + (data.message || "Unknown error"));
            }
          })
          .catch(err => {
            console.error("Error:", err);
            alert("An error occurred while deleting.");
          });
      }
    }

    // ✅ ADD NEW BUS ROW
    function addNewRow() {
      const table = document.querySelector("#outputTable tbody");
      const newRow = table.insertRow();

      newRow.innerHTML = `
        <td>Auto</td>
        <td contenteditable="true" style="background:#fef3c7;">Enter Bus Number</td>
        <td contenteditable="true" style="background:#fef3c7;">Enter Driver Name</td>
        <td>
          <button class="save-btn" onclick="saveNewBus(this)">Save</button>
          <button class="delete-btn" onclick="this.closest('tr').remove()">Cancel</button>
        </td>
      `;
    }

    // ✅ SAVE NEW BUS (POST to backend)
    function saveNewBus(button) {
      const row = button.closest("tr");
      const busNumber = row.cells[1].textContent.trim();
      const driverName = row.cells[2].textContent.trim();

      if (!busNumber || !driverName) {
        alert("⚠️ Please fill in all fields.");
        return;
      }

      fetch("/add_bus", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ bus_number: busNumber, driver_name: driverName })
      })
        .then(res => res.json())
        .then(data => {
          if (data.success) {
            alert("✅ Bus added successfully!");
            location.reload();
          } else {
            alert("❌ Failed to add bus: " + (data.message || "Unknown error"));
          }
        })
        .catch(err => console.error("Error:", err));
    }
  </script>
</body>
</html>
