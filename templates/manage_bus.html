<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel - Bus Data Management</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      height: 100vh;
      background: #f4f6f9;
    }

    /* Sidebar */
    .sidebar {
      width: 220px;
      background: #1e293b;
      color: #fff;
      display: flex;
      flex-direction: column;
      padding: 20px;
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      box-shadow: 2px 0 5px rgba(0, 0, 0, 0.2);
      transition: width 0.3s ease;
      overflow: hidden;
    }

    .sidebar.collapsed {
      width: 60px;
    }

    .sidebar h2 {
      margin: 0 0 20px;
      font-size: 20px;
      text-align: center;
      transition: opacity 0.3s ease;
    }

    .sidebar.collapsed h2 {
      opacity: 0;
      height: 0;
    }

    .sidebar a {
      color: #cbd5e1;
      text-decoration: none;
      padding: 12px 15px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      margin-bottom: 10px;
      transition: all 0.3s;
      white-space: nowrap;
    }

    .sidebar a:hover {
      background: #334155;
      color: #fff;
    }

    .sidebar.collapsed a span {
      display: none;
    }

    /* Toggle Button */
    .toggle-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      margin-bottom: 20px;
      align-self: flex-end;
    }

    /* Main Content */
    .main-content {
      margin-left: 220px;
      padding: 30px;
      flex: 1;
      transition: margin-left 0.3s ease;
    }

    .main-content.collapsed {
      margin-left: 60px;
    }

    .main-content h2 {
      font-size: 26px;
      color: #1e293b;
      text-align: center;
      margin-bottom: 20px;
    }

    #formContainer {
      text-align: center;
      margin-bottom: 20px;
      background: #fff;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 0 6px rgba(0, 0, 0, 0.1);
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }

    label {
      display: block;
      margin-top: 10px;
    }

    input,
    textarea,
    select {
      width: 90%;
      padding: 8px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }

    button {
      margin: 5px;
      padding: 8px 16px;
      background-color: #2563eb;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background-color: #1d4ed8;
    }

    /* Table Container for Responsiveness */
    .table-container {
      width: 100%;
      overflow-x: auto;
      background: white;
      border-radius: 8px;
      box-shadow: 0 0 8px rgba(0, 0, 0, 0.1);
      margin-top: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 700px;
    }

    th,
    td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: center;
    }

    tr:nth-child(even) {
      background-color: #f9f9f9;
    }

    tr:hover {
      background-color: #f1f5f9;
    }

    th {
      background-color: #04AA6D;
      color: white;
    }

    .delete-btn {
      background-color: #ef4444;
    }

    .delete-btn:hover {
      background-color: #dc2626;
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        height: 100%;
        z-index: 100;
      }

      .main-content {
        margin-left: 60px;
        padding: 15px;
      }

      input,
      textarea,
      select {
        width: 80%;
      }

      table {
        font-size: 12px;
      }

      th,
      td {
        padding: 6px;
      }
    }
  </style>
</head>

<body>
  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <button class="toggle-btn" onclick="toggleSidebar()">☰</button>
    <h2>Admin Panel</h2>
    <a href="{{ url_for('manage_bus') }}">🚌 <span>Manage Buses</span></a>
    <a href="{{ url_for('manage_driver') }}">🙋🏻‍♂️ <span>Manage Driver</span></a>
    <a href="{{ url_for('manage_routes') }}">🛣 <span>Manage Routes</span></a>
    <a href="{{ url_for('logout') }}">🚪 <span>Logout</span></a>
  </div>

  <!-- Main Content -->
  <div class="main-content" id="mainContent">
    <h2>Bus Data Management</h2>

    <div class="table-container">
      <table id="outputTable">
        <thead>
          <tr>
            <th>Bus ID</th>
            <th>Bus Number</th>
            <th>Driver Name</th>
            <!-- <th>Capacity</th> -->
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          {% for bus in buses %}
          <tr>
            <td>{{ bus.bus_id }}</td>
            <td>{{ bus.bus_number }}</td>
            <td>{{ bus.driver_name }}</td>
            <!-- <td>{{ bus.capacity }}</td> -->
            <td>
              <button class="action-btn" onclick="editRow(this)">Edit</button>
              <button class="delete-btn" onclick="deleteData(this)">Delete</button>
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>

  <script>
    function toggleSidebar() {
      document.getElementById("sidebar").classList.toggle("collapsed");
      document.getElementById("mainContent").classList.toggle("collapsed");
    }

    // Editable Table
    function editRow(button) {
      const row = button.closest("tr");
      const cells = row.querySelectorAll("td:not(:last-child)");

      if (button.textContent === "Edit") {
        cells.forEach(td => {
          td.setAttribute("contenteditable", "true");
          td.style.background = "#fef3c7"; // light yellow
        });
        button.textContent = "Save";
        button.style.background = "#10b981"; // green
      } else {
        cells.forEach(td => {
          td.removeAttribute("contenteditable");
          td.style.background = "";
        });
        button.textContent = "Edit";
        button.style.background = "#2563eb";

        // Collect data
        const data = Array.from(cells).map(td => td.textContent.trim());
        console.log("Updated Bus Data:", data);
        // TODO: send data to Flask backend using fetch() POST
      }
    }

    function deleteData(button) {
      const row = button.closest("tr");
      if (confirm("Are you sure you want to delete this record?")) {
        row.remove();
        // TODO: send DELETE request to Flask backend
      }
    }

    function addData() {
      const table = document.getElementById("outputTable").querySelector("tbody");
      const busId = document.getElementById("busIdInput").value;
      const busNumber = document.getElementById("busNumberInput").value;
      const capacity = document.getElementById("busCapacityInput").value;
      const driver = document.getElementById("driverSelect").selectedOptions[0].text;

      if (!busId || !busNumber || !capacity) {
        alert("Please fill all fields.");
        return;
      }

      const newRow = `
        <tr>
          <td>${busId}</td>
          <td>${busNumber}</td>
          <td>${driver}</td>
          <td>${capacity}</td>
          <td>
            <button class="action-btn" onclick="editRow(this)">Edit</button>
            <button class="delete-btn" onclick="deleteData(this)">Delete</button>
          </td>
        </tr>
      `;
      table.insertAdjacentHTML("beforeend", newRow);

      // Clear inputs
      document.getElementById("busIdInput").value = "";
      document.getElementById("busNumberInput").value = "";
      document.getElementById("busCapacityInput").value = "";
      document.getElementById("driverSelect").selectedIndex = 0;
    }
  </script>
</body>
</html>
