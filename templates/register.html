<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f7f9fb;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      background-color: #fff;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      width: 400px;
      text-align: center;
    }

    h2 {
      margin-bottom: 20px;
      color: #2f3640;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .textbox, select {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.3s ease;
    }

    .textbox:focus, select:focus {
      border-color: #3498db;
    }

    .btn {
      background-color: #3498db;
      color: white;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .btn:hover {
      background-color: #2980b9;
    }

    .msg {
      color: red;
      margin-bottom: 10px;
    }

    .bottom {
      margin-top: 15px;
      font-size: 14px;
    }

    a {
      color: #3498db;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Student Registration</h2>
    <div class="msg">{{ msg }}</div>

    <form action="{{ url_for('register') }}" method="POST">
      <input class="textbox" type="text" name="student_id" placeholder="Enter Student ID (e.g., JIET/DS/22/030)" required>
      <input class="textbox" type="text" name="name" placeholder="Enter Full Name" required>

      <select name="department" required>
        <option value="">Select Department</option>
        <option value="CSE">CSE</option>
        <option value="CSE-DS">CSE (Data Science)</option>
        <option value="ECE">ECE</option>
        <option value="EE">EE</option>
        <option value="ME">ME</option>
        <option value="CE">CE</option>
      </select>

      <!-- Year of Enrollment -->
      <select name="year" required>
        <option value="">Select Year of Enrollment</option>
        <option value="2024">2024</option>
        <option value="2025">2025</option>
        <option value="2026">2026</option>
      </select>

      <!-- Bus Stop -->
      <select name="bus_stop" class="textbox" required>
        <option value="">Select Bus Stop</option>
          {% for stop in bus_stops %}
            <option value="{{ stop }}">{{ stop }}</option>
          {% endfor %}
      </select>

      <input class="textbox" type="email" name="email" placeholder="Enter College Email ID" required>
      <input class="textbox" type="password" name="password" placeholder="Enter Password" required>

      <button class="btn" type="submit">Register</button>
    </form>

    <p class="bottom">
      Already have an account? 
      <a href="{{ url_for('login') }}">Login here</a>
    </p>
  </div>

</body>
</html>
