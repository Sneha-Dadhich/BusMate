<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bus Route Viewer</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style3.css') }}">
</head>

<body>

  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <button class="toggle-btn" onclick="toggleSidebar()">☰</button>

    <h2>Hi</h2>
    <a href="{{ url_for('buses_for_stop') }}">🚌 <span>My Bus</span></a>
    <a href="{{ url_for('bus_id') }}">🚌 <span>Bus ID</span></a>
    <a href="{{ url_for('track_bus_page') }}">🚌 <span>Track My Bus</span></a>
  </div>

  <!-- Main Content -->
  <div class="main-content" id="mainContent">
    <div class="title-row">
      <img src="{{ url_for('static', filename='images/jiet_logo.jpg') }}" class="title-logo">
      <h1>Bus Tracker</h1>
    </div>

    <div class="container">
        <h2>Select Bus to View Stops</h2>

        <select id="busDropdown" onchange="loadStops()">
          <option value="">Select Bus ID</option>
        </select>

        <div id="stopsContainer"></div>
    </div>

  </div>


  <script>


    function sendLocation() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition((pos) => {
                fetch("/update_location", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({
                        bus_id: localStorage.getItem("bus_id"),
                        lat: pos.coords.latitude,
                        lng: pos.coords.longitude
                    })
                });
            });
        }
    }

    setInterval(sendLocation, 5000);

    function loadBusIds() {
      fetch("/get_buses")
        .then(res => res.json())
        .then(data => {
          const dropdown = document.getElementById("busDropdown");
          dropdown.innerHTML = "<option value=''>Select Bus ID</option>";
          data.bus_ids.forEach(id => {
            let opt = document.createElement("option");
            opt.value = id;
            opt.textContent = id;
            dropdown.appendChild(opt);
          });
        });
    }

    function loadStops() {
        const busId = document.getElementById("busDropdown").value;
        const container = document.getElementById("stopsContainer");

        if (!busId) {
          container.innerHTML = "";
          return;
        }

        fetch(`/current_location/${busId}`)
            .then(res => res.json())
            .then(data => {
              container.innerHTML = "";

              if (data.stops.length === 0) {
                container.innerHTML = "<p>No stops found for this bus.</p>";
                return;
          }

          data.stops.forEach(stop => {
            const div = document.createElement("div");
            div.className = "stop-box";

            div.innerHTML = `
              <strong>${stop.stop_name}</strong><br>
              <span>Arrival Time: ${stop.arrival_time}</span><br>
              <span>Status: <b>${stop.status}</b></span>
            `;


            container.appendChild(div);
          });
        });
      }

    window.onload = loadBusIds;

    function toggleSidebar() {
      document.getElementById("sidebar").classList.toggle("collapsed");
      document.getElementById("mainContent").classList.toggle("collapsed");
    }

    function sendLocation() {
        const busId = document.getElementById("busDropdown").value;

        if (!busId) return;

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(pos => {
                fetch('/update_location', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        bus_id: busId,
                        lat: pos.coords.latitude,
                        lng: pos.coords.longitude
                    })
                });
            });
        }
    }

    // send location every 5 seconds
    setInterval(sendLocation, 5000);
  </script>

</body>
</html>
