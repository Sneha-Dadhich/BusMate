<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style2.css') }}">
    <title>Login</title>
</head>
<body>

      <!-- JIET Logo -->
    <div style="text-align: center; margin-bottom: 20px;" class="logo-container">
        <img src="{{ url_for('static', filename='images/JIET_universe_logo.png') }}"
             alt="JIET Logo"
             style="width: 150px; height: auto;">
    </div>


    <div class="container">  <!-- Wrapper for form -->
        <h2 class="word">Login</h2>
        
        <form action="{{ url_for('login') }}" method="post">
            <div>{{ msg }}</div>

            <input class="textbox" type="text" name="email" placeholder="Enter Email" required>
            <input class="textbox" type="password" name="password" placeholder="Enter Password" required>
            
            <button class="btn" type="submit">Login</button>
        </form>

        <p class="bottom">Don't have an account? <a href="{{ url_for('register') }}">Register here</a></p>
        <p class="bottom">Admin? <a href="{{ url_for('admin_login') }}">Login here</a></p>
    </div>

</body>
</html>
